spring.application.name=payment-api
server.port=${SERVER_PORT:8800}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/payment_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true

# Seguranca: token do Gateway (rotas /ws/payments/**) e token servico-a-servico (order-api).
payment.security.gateway-token=${GATEWAY_PAYMENT_DOWNSTREAM_TOKEN:}
payment.security.service-token=${SERVICE_AUTH_TOKEN:}

# order-api (resolvido via Consul + LoadBalancer).
payment.clients.order-api.base-url=${ORDER_API_BASE_URL:http://order-api}
payment.clients.connect-timeout-ms=2000
payment.clients.read-timeout-ms=10000

# Tempo minimo de reserva restante para abrir uma nova sessao de checkout.
payment.min-reservation-seconds=${PAYMENT_MIN_RESERVATION_SECONDS:120}

# Stripe (somente modo teste). No Docker os valores vem do Consul (config/payment-api/payment.stripe.*);
# as variaveis de ambiente servem apenas para execucao local fora do Docker.
payment.stripe.secret-key=${STRIPE_SECRET_KEY:}
payment.stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
payment.stripe.success-url=${PAYMENT_SUCCESS_URL:}
payment.stripe.cancel-url=${PAYMENT_CANCEL_URL:}

# Deep links do app para onde /payments/return/{success,cancel} redireciona o navegador.
payment.return.app-success-url=${PAYMENT_APP_SUCCESS_URL:oma://payment/success}
payment.return.app-cancel-url=${PAYMENT_APP_CANCEL_URL:oma://payment/cancel}
payment.stripe.connect-timeout-ms=5000
payment.stripe.read-timeout-ms=20000

spring.cloud.consul.host=${CONSUL_HOST:localhost}
spring.cloud.consul.port=${CONSUL_PORT:8500}
spring.config.import=optional:consul:
