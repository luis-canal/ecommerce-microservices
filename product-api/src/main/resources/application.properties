spring.application.name=product-api
server.port=8000

spring.datasource.url=jdbc:postgresql://localhost/db_product
spring.datasource.username=postgres
spring.datasource.password=canal222

app.promotion.message=Christmas Promotion

#spring.profiles.active=es

spring.cloud.consul.host=localhost
spring.cloud.consul.port=8500
inventory.security.service-token=${SERVICE_AUTH_TOKEN:}

spring.config.import=optional:consul:

# Imagens de produto (armazenamento compatível com S3; ex.: Supabase Storage)
app.storage.s3.endpoint=${STORAGE_S3_ENDPOINT:}
app.storage.s3.region=${STORAGE_S3_REGION:}
app.storage.s3.access-key=${STORAGE_S3_ACCESS_KEY:}
app.storage.s3.secret-key=${STORAGE_S3_SECRET_KEY:}
app.storage.s3.bucket=${STORAGE_S3_BUCKET:product-images}
app.storage.public-base-url=${STORAGE_PUBLIC_BASE_URL:}
app.images.max-size-bytes=5242880
app.images.max-per-product=8
# Um pouco acima do limite da imagem para que a validação da aplicação responda com a mensagem própria.
spring.servlet.multipart.max-file-size=6MB
spring.servlet.multipart.max-request-size=6MB
