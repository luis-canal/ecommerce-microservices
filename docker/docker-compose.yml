services:

  # ==========================================================
  # CONSUL - SERVICE DISCOVERY E CENTRALIZED CONFIGURATION
  # ==========================================================
  consul:
    image: hashicorp/consul:1.21
    container_name: consul
    command: agent -dev -client=0.0.0.0 -ui
    ports:
      - "8500:8500"
    healthcheck:
      test: ["CMD", "consul", "members"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend

  # ==========================================================
  # CARREGAMENTO DAS CONFIGURAÇÕES NO CONSUL
  # ==========================================================
  consul-config:
    image: hashicorp/consul:1.21
    container_name: consul-config
    entrypoint: ["/bin/sh", "/scripts/load-config.sh"]
    volumes:
      - ./consul/config/load-config.sh:/scripts/load-config.sh:ro
      - auth_internal_secret:/run/secrets
    environment:
      CONSUL_HTTP_ADDR: http://consul:8500
    depends_on:
      consul:
          condition: service_healthy
    restart: "no"
    networks:
      - backend

  # ==========================================================
  # BANCO DE DADOS - PRODUCT API
  # ==========================================================
  product-db:
    image: postgres:17
    container_name: product-db
    environment:
      POSTGRES_DB: db_product
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - product_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d db_product"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend
    restart: unless-stopped

  # ==========================================================
  # BANCO DE DADOS - CURRENCY API
  # ==========================================================
  currency-db:
    image: postgres:17
    container_name: currency-db
    environment:
      POSTGRES_DB: db_currency
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - currency_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d db_currency"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend
    restart: unless-stopped

  # ==========================================================
  # BANCO DE DADOS - AUTH API
  # ==========================================================
  auth-db:
    image: postgres:17
    container_name: auth-db
    environment:
      POSTGRES_DB: db_user
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - auth_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d db_user"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend
    restart: unless-stopped

  # ==========================================================
  # BANCO DE DADOS - INVENTORY API
  # ==========================================================
  inventory-db:
    image: postgres:17
    container_name: inventory-db
    environment:
      POSTGRES_DB: db_inventory
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - inventory_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d db_inventory"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend
    restart: unless-stopped

  # ==========================================================
  # BANCO DE DADOS - ORDER API
  # ==========================================================
  order-db:
    image: postgres:17
    container_name: order-db
    environment:
      POSTGRES_DB: db_order
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - order_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d db_order"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend
    restart: unless-stopped

  # ==========================================================
  # BANCO DE DADOS - CART API
  # ==========================================================
  cart-db:
    image: postgres:17
    container_name: cart-db
    environment:
      POSTGRES_DB: db_cart
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - cart_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d db_cart"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend
    restart: unless-stopped

  # ==========================================================
  # PRODUCT API
  # ==========================================================
  product-api:
    build:
      context: ../product-api
    container_name: product-api
    environment:
      SPRING_CONFIG_IMPORT: "consul:"
      SPRING_CLOUD_CONSUL_HOST: consul
      SPRING_CLOUD_CONSUL_PORT: 8500
    depends_on:
      consul-config:
          condition: service_completed_successfully
      product-db:
          condition: service_healthy
    networks:
      - backend
    restart: unless-stopped

  # ==========================================================
  # CURRENCY API
  # ==========================================================
  currency-api:
    build:
      context: ../currency-api
    container_name: currency-api
    environment:
      SPRING_CONFIG_IMPORT: "consul:"
      SPRING_CLOUD_CONSUL_HOST: consul
      SPRING_CLOUD_CONSUL_PORT: 8500
    depends_on:
      consul-config:
          condition: service_completed_successfully
      currency-db:
          condition: service_healthy
    networks:
      - backend
    restart: unless-stopped

  # ==========================================================
  # AUTH API
  # ==========================================================
  auth-api:
    build:
      context: ../auth-api
    container_name: auth-api
    environment:
      SPRING_CONFIG_IMPORT: "consul:"
      SPRING_CLOUD_CONSUL_HOST: consul
      SPRING_CLOUD_CONSUL_PORT: 8500
    depends_on:
      consul-config:
          condition: service_completed_successfully
      auth-db:
          condition: service_healthy
    networks:
      - backend
    restart: unless-stopped

  # ==========================================================
  # INVENTORY API
  # ==========================================================
  inventory-api:
    build:
      context: ../inventory-api
    container_name: inventory-api
    environment:
      SPRING_CONFIG_IMPORT: "consul:"
      SPRING_CLOUD_CONSUL_HOST: consul
      SPRING_CLOUD_CONSUL_PORT: 8500
    depends_on:
      consul-config:
        condition: service_completed_successfully
      inventory-db:
        condition: service_healthy
      product-api:
        condition: service_started
    networks:
      - backend
    restart: unless-stopped

  # ==========================================================
  # ORDER API
  # ==========================================================
  order-api:
    build:
      context: ../order-api
    container_name: order-api
    environment:
      SPRING_CONFIG_IMPORT: "consul:"
      SPRING_CLOUD_CONSUL_HOST: consul
      SPRING_CLOUD_CONSUL_PORT: 8500
    depends_on:
      consul-config:
        condition: service_completed_successfully
      order-db:
        condition: service_healthy
      product-api:
        condition: service_started
      currency-api:
        condition: service_started
      inventory-api:
        condition: service_started
    networks:
      - backend
    restart: unless-stopped

  # ==========================================================
  # CART API
  # ==========================================================
  cart-api:
    build:
      context: ../cart-api
    container_name: cart-api
    environment:
      SPRING_CONFIG_IMPORT: "consul:"
      SPRING_CLOUD_CONSUL_HOST: consul
      SPRING_CLOUD_CONSUL_PORT: 8500
    depends_on:
      consul-config:
        condition: service_completed_successfully
      cart-db:
        condition: service_healthy
      product-api:
        condition: service_started
      inventory-api:
        condition: service_started
    networks:
      - backend
    restart: unless-stopped

  # ==========================================================
  # GATEWAY API
  # ==========================================================
  gateway-api:
    build:
      context: ../gateway-api
    container_name: gateway-api
    ports:
      - "8080:8080"
    environment:
      SPRING_CONFIG_IMPORT: "consul:"
      SPRING_CLOUD_CONSUL_HOST: consul
      SPRING_CLOUD_CONSUL_PORT: 8500
    depends_on:
      consul-config:
          condition: service_completed_successfully
    networks:
      - backend
    restart: unless-stopped

  # ==========================================================
  # ZIPKIN - DISTRIBUTED TRACING
  # ==========================================================
  zipkin:
    image: openzipkin/zipkin:latest
    container_name: zipkin
    ports:
      - "9411:9411"
    restart: unless-stopped
    networks:
      - backend

  # ==========================================================
  # PROMETHEUS - METRICS COLLECTION
  # ==========================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    restart: unless-stopped
    networks:
      - backend

  # ==========================================================
  # LOKI - LOG AGGREGATION
  # ==========================================================
  loki:
    image: grafana/loki:3.7.0
    container_name: loki
    ports:
      - "3100:3100"
    volumes:
      - ./loki/loki-config.yaml:/etc/loki/config.yaml:ro
      - loki_data:/loki
    command:
      - "-config.file=/etc/loki/config.yaml"
    restart: unless-stopped
    networks:
      - backend

  # ==========================================================
  # GRAFANA ALLOY - LOG COLLECTION
  # ==========================================================
  alloy:
    image: grafana/alloy:latest
    container_name: alloy
    ports:
      - "12345:12345"
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - alloy_data:/var/lib/alloy/data
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    depends_on:
      - loki
    restart: unless-stopped
    networks:
      - backend

# ============================================================
# REDE INTERNA
# ============================================================
networks:
  backend:
    driver: bridge


# ============================================================
# VOLUMES PERSISTENTES DOS BANCOS
# ============================================================
volumes:
  product_data:
  currency_data:
  auth_data:
  inventory_data:
  order_data:
  cart_data:
  auth_internal_secret:
  prometheus_data:
  loki_data:
  alloy_data: