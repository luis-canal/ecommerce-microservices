server:
  port: 8100
spring:
  config:
    import: "optional:consul:"
  cloud:
    consul:
      host: ${CONSUL_HOST:consul}
      port: 8500
      config:
        format: YAML
      discovery:
        prefer-ip-address: true
        health-check-path: /actuator/health
        instance-id: ${spring.application.name}:${random.value}
  datasource:
    url: ${DB_URL:jdbc:postgresql://postgres:5432/currency_db}
    username: ${DB_USER:ecommerce}
    password: ${DB_PASSWORD}
  rabbitmq:
    host: ${RABBIT_HOST:rabbitmq}
    username: ${RABBIT_USER:ecommerce}
    password: ${RABBIT_PASSWORD}
management:
  endpoints:
    web:
      exposure:
        include: health
app:
  currency:
    bcb:
      base-url: https://olinda.bcb.gov.br/olinda/servico/PTAX/versao/v1/odata
      quote-date: "2025-10-10"
internal:
  api-key: ${INTERNAL_API_KEY}