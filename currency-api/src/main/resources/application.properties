spring.application.name=currency-api

spring.cloud.consul.host=localhost
spring.cloud.consul.port=8500

spring.config.import=optional:consul:

# Estrutural: timeouts HTTP da integração PTAX são versionados no repositório.
app.currency.bcb.connect-timeout=2s
app.currency.bcb.read-timeout=5s

# Cache e resiliência são comportamento estrutural, não configuração por ambiente.
spring.cache.type=caffeine
spring.cache.cache-names=ptaxQuotes
spring.cache.caffeine.spec=maximumSize=1000,expireAfterWrite=10m
resilience4j.retry.retry-aspect-order=100
resilience4j.retry.instances.bcb-ptax.max-attempts=3
resilience4j.retry.instances.bcb-ptax.wait-duration=1s
resilience4j.retry.instances.bcb-ptax.ignore-exceptions=io.github.resilience4j.circuitbreaker.CallNotPermittedException
resilience4j.circuitbreaker.circuit-breaker-aspect-order=101
resilience4j.circuitbreaker.instances.bcb-ptax.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.bcb-ptax.sliding-window-size=5
resilience4j.circuitbreaker.instances.bcb-ptax.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.bcb-ptax.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.bcb-ptax.wait-duration-in-open-state=100s
