spring.application.name=currency-api

spring.cloud.consul.host=localhost
spring.cloud.consul.port=8500

spring.config.import=optional:consul:

# External BCB PTAX endpoint (use a direct RestClient; do not resolve through Consul).
app.currency.bcb.base-url=https://olinda.bcb.gov.br/olinda/servico/PTAX/versao/v1/odata
app.currency.bcb.quote-date=2024-01-02
app.currency.bcb.connect-timeout=2s
app.currency.bcb.read-timeout=5s
