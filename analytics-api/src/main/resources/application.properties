spring.application.name=analytics-api
server.port=${SERVER_PORT:8700}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/analytics_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true

# Seguranca: token do Gateway (rotas administrativas) e token servico-a-servico (coleta).
analytics.security.gateway-token=${GATEWAY_ANALYTICS_DOWNSTREAM_TOKEN:}
analytics.security.service-token=${SERVICE_AUTH_TOKEN:}

# Servicos de origem (resolvidos via Consul + LoadBalancer).
analytics.clients.order-api.base-url=${ORDER_API_BASE_URL:http://order-api}
analytics.clients.inventory-api.base-url=${INVENTORY_API_BASE_URL:http://inventory-api}

# Coleta periodica.
analytics.collection.enabled=${ANALYTICS_COLLECTION_ENABLED:true}
analytics.collection.interval-ms=${ANALYTICS_COLLECTION_INTERVAL_MS:300000}

spring.cloud.consul.host=${CONSUL_HOST:localhost}
spring.cloud.consul.port=${CONSUL_PORT:8500}
spring.config.import=optional:consul:
