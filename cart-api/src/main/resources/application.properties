spring.application.name=cart-api
server.port=${SERVER_PORT:8600}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/db_cart}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

spring.cloud.consul.host=${CONSUL_HOST:localhost}
spring.cloud.consul.port=${CONSUL_PORT:8500}
spring.config.import=optional:consul:

cart.clients.product-api.base-url=${PRODUCT_API_BASE_URL:http://product-api}
cart.clients.inventory-api.base-url=${INVENTORY_API_BASE_URL:http://inventory-api}
cart.security.service-token=${SERVICE_AUTH_TOKEN:}
cart.security.gateway-token=${CART_GATEWAY_TOKEN:}
