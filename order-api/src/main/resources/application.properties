spring.application.name=order-api
server.port=${SERVER_PORT:8300}

spring.datasource.url=jdbc:postgresql://localhost/db_order
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.data.web.pageable.max-page-size=100

spring.cloud.consul.host=${CONSUL_HOST:localhost}
spring.cloud.consul.port=${CONSUL_PORT:8500}

spring.config.import=optional:consul:

order.security.gateway-token=${ORDER_GATEWAY_TOKEN:}
order.security.service-token=${SERVICE_AUTH_TOKEN:}
order.clients.product-api.base-url=${PRODUCT_API_BASE_URL:http://product-api}
order.clients.currency-api.base-url=${CURRENCY_API_BASE_URL:http://currency-api}
order.clients.inventory-api.base-url=${INVENTORY_API_BASE_URL:http://inventory-api}
order.clients.inventory-api.service-token=${SERVICE_AUTH_TOKEN:}
order.reservations.expiration-scan-ms=${RESERVATION_EXPIRATION_SCAN_MS:30000}