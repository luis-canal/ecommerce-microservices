spring.application.name=inventory-api
server.port=${SERVER_PORT:8400}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/db_inventory}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.data.web.pageable.max-page-size=200
inventory.reservations.expiration-scan-ms=${RESERVATION_EXPIRATION_SCAN_MS:30000}
inventory.clients.product-api.base-url=${PRODUCT_API_BASE_URL:http://product-api}
inventory.security.service-token=${SERVICE_AUTH_TOKEN:}
inventory.security.gateway-token=${GATEWAY_DOWNSTREAM_TOKEN:}

spring.cloud.consul.host=${CONSUL_HOST:localhost}
spring.cloud.consul.port=${CONSUL_PORT:8500}
spring.config.import=optional:consul:
