spring.application.name=gateway-api
spring.cloud.consul.host=localhost
spring.cloud.consul.port=8500
spring.config.import=consul:
gateway.security.service-token=${SERVICE_AUTH_TOKEN:}
gateway.security.inventory-downstream-token=${GATEWAY_DOWNSTREAM_TOKEN:}
gateway.security.order-downstream-token=${GATEWAY_ORDER_DOWNSTREAM_TOKEN:}
gateway.security.analytics-downstream-token=${GATEWAY_ANALYTICS_DOWNSTREAM_TOKEN:}
gateway.security.payment-downstream-token=${GATEWAY_PAYMENT_DOWNSTREAM_TOKEN:}
spring.cloud.gateway.server.webflux.globalcors.add-to-simple-url-handler-mapping=true
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-origin-patterns=*
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-methods=*
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-headers=*
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].max-age=3600
