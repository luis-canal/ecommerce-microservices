server:
  port: 8200
spring:
  config:
    import: "consul:"
  cloud:
    consul:
      host: ${CONSUL_HOST:consul}
      port: 8500
      config:
        format: YAML
      discovery:
        prefer-ip-address: true
        health-check-path: /actuator/health
        instance-id: ${spring.application.name}:${random.value}
  datasource:
    url: ${DB_URL:jdbc:postgresql://postgres:5432/auth_db}
    username: ${DB_USER:ecommerce}
    password: ${DB_PASSWORD}
  rabbitmq:
    host: ${RABBIT_HOST:rabbitmq}
    username: ${RABBIT_USER:ecommerce}
    password: ${RABBIT_PASSWORD}
management:
  endpoints:
    web:
      exposure:
        include: health