
services:
  consul:
    image: hashicorp/consul:latest
    command: >
      agent -dev
      -client=0.0.0.0
      -ui
    ports:
      - "127.0.0.1:8500:8500"
    restart: unless-stopped

  postgres-auth:
    image: postgres:17

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      POSTGRES_DB: db_user

      POSTGRES_AUTH_APP_PASSWORD: ${POSTGRES_AUTH_APP_PASSWORD}

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - postgres_auth_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init/01-create-auth-user.sh:/docker-entrypoint-initdb.d/01-create-auth-user.sh:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

    restart: unless-stopped

volumes:
  postgres_auth_data:
